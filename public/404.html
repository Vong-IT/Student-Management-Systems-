<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ប្រព័ន្ធគ្រប់គ្រងព័ត៌មានសិស្ស - វិទ្យាល័យម៉ាឡៃ</title>
    <script>
      // Single Page App redirect for GitHub Pages
      sessionStorage.redirect = location.href;
      var repoBase = location.pathname.split('/')[1];
      if (repoBase && location.hostname.endsWith('github.io')) {
        location.replace('/' + repoBase + '/');
      } else {
        location.replace('/');
      }
    </script>
  </head>
  <body>
    <p>កំពុងបញ្ជូនបន្ត...</p>
  </body>
</html>

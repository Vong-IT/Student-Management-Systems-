    <script>
      // Defensive shim for environments where window.fetch has only a getter
      (function() {
        // 1. Intercept any uncaught errors about fetch having only a getter
        try {
          window.addEventListener('error', function(event) {
            if (event && event.message && typeof event.message === 'string' &&
                event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
              if (typeof event.preventDefault === 'function') event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
              return true;
            }
          }, true);
        } catch (e) {}

        // 2. Ensure fetch has a setter on window and its prototype chain
        try {
          var activeFetch = window.fetch;

          function patchTarget(target) {
            if (!target) return;
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (desc) {
                if (desc.get && !desc.set) {
                  Object.defineProperty(target, 'fetch', {
                    get: function() { return activeFetch; },
                    set: function(fn) { activeFetch = fn; },
                    configurable: true,
                    enumerable: desc.enumerable !== false
                  });
                } else if (!desc.writable && !desc.set && desc.configurable) {
                  Object.defineProperty(target, 'fetch', {
                    value: activeFetch,
                    writable: true,
                    configurable: true,
                    enumerable: desc.enumerable !== false
                  });
                }
              }
            } catch (err) {}
          }

          var curr = window;
          while (curr) {
            patchTarget(curr);
            curr = Object.getPrototypeOf(curr);
          }

          if (typeof Window !== 'undefined' && Window.prototype) {
            patchTarget(Window.prototype);
          }

          try {
            var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (!winDesc || (winDesc.get && !winDesc.set) || !winDesc.writable) {
              Object.defineProperty(window, 'fetch', {
                get: function() { return activeFetch; },
                set: function(fn) { activeFetch = fn; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e1) {
            try {
              Object.defineProperty(window, 'fetch', {
                value: activeFetch,
                writable: true,
                configurable: true,
                enumerable: true
              });
            } catch (e2) {}
          }
        } catch (err) {}
      })();
    </script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="50%" height="50%">
  <defs>
    <!-- Filter for subtle depth if needed -->
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.15" />
    </filter>

    <!-- Upper Text Arc (Clockwise for readable top text) -->
    <!-- Center (250, 250), radius 180 -->
    <path id="upperTextArc" d="M 70,250 A 180,180 0 1,1 430,250" fill="none" />

    <!-- Lower Text Arc for MALAI HIGH SCHOOL (Counter-clockwise along bottom so letters are upright) -->
    <path id="lowerOuterTextArc" d="M 75,250 A 175,175 0 0,0 425,250" fill="none" />
    <path id="lowerOuterTextArcUpright" d="M 425,250 A 175,175 0 0,1 75,250" fill="none" />

    <!-- Lower Inner Text Arc for Since 1991 -->
    <path id="lowerInnerTextArc" d="M 370,250 A 120,120 0 0,1 130,250" fill="none" />
  </defs>

  <!-- Background Circle (Pure White) -->
  <circle cx="250" cy="250" r="242" fill="#ffffff" />

  <!-- Outer Double Blue Rings -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#002b9e" stroke-width="7" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="#002b9e" stroke-width="3" />

  <!-- Inner Boundary Ring around Central Graphics -->
  <circle cx="250" cy="250" r="144" fill="none" stroke="#002b9e" stroke-width="2.5" />

  <!-- Side Petal Ornaments (Left & Right) -->
  <!-- Left Ornament at (64, 250) -->
  <g transform="translate(64, 250)">
    <circle cx="-5" cy="-7" r="6" fill="#002b9e" />
    <circle cx="-5" cy="7" r="6" fill="#002b9e" />
    <circle cx="6" cy="0" r="6" fill="#002b9e" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Right Ornament at (436, 250) -->
  <g transform="translate(436, 250)">
    <circle cx="5" cy="-7" r="6" fill="#002b9e" />
    <circle cx="5" cy="7" r="6" fill="#002b9e" />
    <circle cx="-6" cy="0" r="6" fill="#002b9e" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Upper Arched Text: វិទ្យាល័យ ម៉ាឡៃ -->
  <text fill="#002b9e" font-size="36" font-weight="bold" font-family="'Moul', 'Khmer OS Muol Light', 'Hanuman', 'Siemreap', serif" letter-spacing="1">
    <textPath href="#upperTextArc" startOffset="50%" text-anchor="middle">វិទ្យាល័យ ម៉ាឡៃ</textPath>
  </text>

  <!-- Lower Outer Arched Text: MALAI HIGH SCHOOL -->
  <text fill="#002b9e" font-size="29" font-weight="900" font-family="'Arial Black', 'Arial', sans-serif" letter-spacing="3.5">
    <textPath href="#lowerOuterTextArc" startOffset="50%" text-anchor="middle">MALAI HIGH SCHOOL</textPath>
  </text>

  <!-- Lower Inner Arched Text: Since 1991 -->
  <text fill="#002b9e" font-size="20" font-weight="bold" font-family="'Arial', sans-serif" letter-spacing="1.5">
    <textPath href="#lowerInnerTextArc" startOffset="50%" text-anchor="middle">Since 1991</textPath>
  </text>

  <!-- ============================================== -->
  <!-- CENTER GRAPHICS: OPEN BOOK & SUPPORTING HAND  -->
  <!-- ============================================== -->
  <g id="center-graphics">
    <!-- Top White Pages Fan (Outlined) -->
    <!-- Left Fan Layer 1 -->
    <path d="M 250,230 C 230,195 205,180 182,185 C 196,174 218,170 250,205 Z" fill="#ffffff" stroke="#e52521" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Left Fan Layer 2 -->
    <path d="M 250,225 C 225,185 195,172 168,180 C 182,166 210,162 250,195 Z" fill="#ffffff" stroke="#e52521" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Left Fan Layer 3 -->
    <path d="M 250,220 C 220,175 185,165 155,175 C 172,158 205,155 250,186 Z" fill="#ffffff" stroke="#e52521" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Right Fan Layer 1 -->
    <path d="M 250,230 C 270,195 295,180 318,185 C 304,174 282,170 250,205 Z" fill="#ffffff" stroke="#0033cc" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Right Fan Layer 2 -->
    <path d="M 250,225 C 275,185 305,172 332,180 C 318,166 290,162 250,195 Z" fill="#ffffff" stroke="#0033cc" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Right Fan Layer 3 -->
    <path d="M 250,220 C 280,175 315,165 345,175 C 328,158 295,155 250,186 Z" fill="#ffffff" stroke="#0033cc" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Left Book Half: Solid Vibrant Red (#e52521) -->
    <path d="M 250,242 
             C 245,215 210,190 166,192 
             C 168,222 195,270 220,288 
             C 232,284 246,270 250,242 Z" 
          fill="#e52521" />

    <!-- Right Book Half: Solid Royal Blue (#0033cc) -->
    <path d="M 250,242 
             C 255,215 290,190 334,192 
             C 332,222 305,270 280,288 
             C 268,284 254,270 250,242 Z" 
          fill="#0033cc" />

    <!-- Center Spine Line -->
    <path d="M 250,185 L 250,265" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- White Ribs / Highlights inside Red & Blue Wings for authentic book look -->
    <path d="M 245,236 C 220,208 190,198 172,204" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 255,236 C 280,208 310,198 328,204" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Supporting Green Hand Underneath (#009b48) -->
    <!-- The hand sweeps elegantly from the right, with fingers/palm scooping under the book -->
    <path d="M 148,272
             C 178,296 220,305 272,302
             C 310,300 336,286 348,274
             C 340,280 305,296 265,297
             C 218,298 178,285 148,272 Z"
          fill="#009b48" />
    <!-- Hand Palm & Thumb cradling upwards -->
    <path d="M 148,272
             C 192,298 250,296 288,272
             C 272,267 242,266 218,274
             C 190,284 165,278 148,272 Z"
          fill="#ffffff" />
    <!-- Green Hand Main Swoop Body -->
    <path d="M 148,272
             C 175,286 210,294 250,294
             C 292,294 330,282 350,270
             C 334,286 295,304 250,304
             C 205,304 170,288 148,272 Z"
          fill="#009b48" />
    <path d="M 146,270
             C 170,284 210,295 258,294
             C 298,293 328,280 348,266
             C 330,278 295,288 258,288
             C 214,288 175,278 146,270 Z"
          fill="#009b48" />
    <path d="M 148,272
             C 180,292 225,302 268,298
             C 305,294 335,280 350,268
             C 332,284 298,306 250,306
             C 200,306 168,288 148,272 Z"
          fill="#009b48" />

    <!-- Palm Swoop Accent -->
    <path d="M 170,280
             C 210,300 260,300 300,284
             C 285,288 260,292 235,290
             C 205,288 185,282 170,280 Z"
          fill="#007a38" />
  </g>
</svg>
